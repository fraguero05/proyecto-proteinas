[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdpipe"
version = "0.1.0"
description = "Pipeline reproducible de diseño computacional de proteínas (tesis de grado, FP-UNA)"
readme = "README.md"
# El tope <3.12 impedia instalar el paquete en Google Colab, que corre sobre
# Ubuntu noble con Python 3.12, y ahi es donde se ejecuta la Fase 3 (GROMACS).
# El desarrollo sigue siendo en 3.11; esto solo deja de prohibir las mayores.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Agüero" }]
keywords = ["proteinas", "bioinformatica", "diseño-computacional", "alphafold", "gromacs"]

# Dependencias base: solo lo necesario para que el andamiaje (Hito 0) corra.
# Las dependencias científicas pesadas viven en los extras de abajo para que
# `uv sync` sin extras siga siendo rápido.
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Un extra por fase, para no instalar PyTorch cuando solo hace falta bajar un PDB.
# Fase 1: descarga y curación.
data = [
    "requests>=2.32",
    "biopython>=1.83",
]
# Fases 3 y 5: dinámica molecular y análisis estructural.
md = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "mdanalysis>=2.7",
    "matplotlib>=3.8",
]
# Fase 4: modelos predictivos.
ml = [
    "torch>=2.2",
    "scikit-learn>=1.4",
]
# Atajo: todo lo científico de una.
sci = [
    "pdpipe[data,md,ml]",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
pdpipe = "pdpipe.cli:app"

[project.urls]
Repository = "https://github.com/fraguero05/proyecto-proteinas"

[tool.hatch.build.targets.wheel]
packages = ["src/pdpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests que requieren acceso a internet (desactivados por defecto)",
]
